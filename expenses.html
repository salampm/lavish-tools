<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Cache Busting -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Lavish Lavender - Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css?v=2.4.1">
</head>
<body class="bg-slate-50 font-['Plus_Jakarta_Sans'] text-slate-900 antialiased selection:bg-violet-100 selection:text-violet-900 custom-scrollbar overflow-x-hidden">
    <div id="app" class="h-screen flex flex-col md:flex-row overflow-hidden">
        <!-- Sidebar -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-72 bg-[#0f172a] border-r border-white/5 transition-transform duration-300 md:relative md:translate-x-0 -translate-x-full">
            <!-- Content injected by app.js -->
        </aside>

        <main class="flex-1 flex flex-col min-w-0 bg-slate-50 h-screen overflow-hidden">
            <!-- Header -->
            <header class="h-20 bg-white/70 backdrop-blur-md border-b border-slate-100 px-8 flex items-center justify-between z-40 sticky top-0">
                <div class="flex items-center gap-4">
                    <button onclick="window.toggleSidebar()" class="p-2.5 bg-slate-50 rounded-xl text-slate-500 md:hidden hover:bg-slate-100 transition-colors">
                        <i data-lucide="Menu" class="w-5 h-5"></i>
                    </button>
                    <h2 class="text-xl font-black text-slate-800 uppercase tracking-tight">Expense Tracker</h2>
                </div>
            </header>

            <div id="view-content" class="flex-1 overflow-hidden">
                <div class="h-full flex items-center justify-center animate-pulse text-slate-300 font-black uppercase text-xs tracking-widest">
                    Loading Ledger...
                </div>
            </div>
        </main>
    </div>

    <!-- Core Scripts -->
    <script src="js/app.js?v=2.4.1"></script>
    <script src="js/firebase.js?v=2.4.1"></script>
    <script src="js/expenses.js?v=2.4.1"></script>
    
    <script>
        window.renderApp = function() {
            window.renderSidebar('expenses');
            const container = document.getElementById('view-content');
            if (window.renderExpenses) {
                container.innerHTML = window.renderExpenses();
                lucide.createIcons();
            }
        };

        window.addEventListener('firebase-ready', () => {
            // Listen to expenses
            window.FB.collection('expenses').onSnapshot((snap) => {
                window.erpState.expenses = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                window.scheduleRender();
            });

            window.FB.collection('sales').onSnapshot((snap) => {
                window.erpState.sales = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                window.scheduleRender();
            });

            window.FB.collection('items').onSnapshot((snap) => {
                window.erpState.items = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                window.scheduleRender();
            });

            window.FB.root('orders').onSnapshot((snap) => {
                window.erpState.orders = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                window.scheduleRender();
            });

            // Listen to categories for persistence
            window.FB.collection('expense_categories').onSnapshot((snap) => {
                const cloudCats = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                const defaults = [
                    { name: 'Rent', requiresBill: false, icon: 'Home' },
                    { name: 'Electricity', requiresBill: true, icon: 'Zap' },
                    { name: 'Staff Salary', requiresBill: false, icon: 'Users' },
                    { name: 'Materials', requiresBill: true, icon: 'ShoppingBag' },
                    { name: 'Handwork Charge', requiresBill: true, icon: 'Scissors' },
                    { name: 'Dye Charge', requiresBill: true, icon: 'Droplets' },
                    { name: 'Marketing', requiresBill: false, icon: 'Target' }
                ];
                
                const merged = [...defaults];
                cloudCats.forEach(cloudCat => {
                    const idx = merged.findIndex(d => d.name.toLowerCase() === cloudCat.name.toLowerCase());
                    if (idx !== -1) {
                        merged[idx] = cloudCat;
                    } else {
                        merged.push(cloudCat);
                    }
                });

                window.erpState.expenseCategories = merged;
                window.scheduleRender();
            });

            // Listen to general settings
            window.FB.collection('settings').doc('general').onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    window.erpState.printerWidth = data.printerWidth || '58';
                    window.erpState.whatsappTemplates = data.whatsappTemplates;
                    if (data.taxes) window.erpState.taxes = data.taxes;
                    if (data.discounts) window.erpState.discounts = data.discounts;
                    if (data.passwords) window.erpState.passwords = data.passwords;
                    if (data.staff) window.erpState.staff = data.staff;
                    if (data.printerConfig) window.erpState.printerConfig = data.printerConfig;

                    window.scheduleRender();
                }
            });

            window.renderApp();
        });

        // Render from cache immediately
        window.renderApp();
    </script>
</body>
</html>
