<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt - Lavish Lavender</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=24">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8f5ff; display: flex; align-items: flex-start; justify-content: center; padding: 24px; min-height: 100vh; }
        .receipt { background: white; width: 100%; max-width: 480px; border-radius: 40px; overflow: hidden; box-shadow: 0 40px 100px rgba(110, 74, 138, 0.12); border: 1px solid rgba(110, 74, 138, 0.05); }
    </style>
</head>
<body>
    <div class="receipt" id="receipt-container">
        <div id="receipt-body">
            <div class="loading" style="text-align: center; padding: 60px;">Loading your receipt...</div>
        </div>
    </div>
    <script src="js/app.js?v=24"></script>
    <script type="module" src="js/firebase.js?v=24"></script>
    <script type="module" src="js/receipt.js?v=24"></script>
    <script type="module">
        window.loadReceipt();
    </script>
</body>
</html>
